<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeeae2"><meta name="description" content="IAD SHOP — Selected goods, all seasons. 季節選物與日常穿搭。"><title>IAD SHOP — A season of your own.</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23262624'/%3E%3Ctext x='32' y='43' text-anchor='middle' fill='%23eeeae2' font-family='Arial' font-size='28'%3EIAD%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><link rel="preload" as="image" href="./首頁影片/summer-poster.jpg"><link rel="preload" as="image" href="./首頁影片/winter-poster.jpg"></head>
<body>
<main class="scene">
 <div class="backdrop" aria-hidden="true"><div class="wash"></div></div>
 <div class="device"><div class="screen" id="screen">
  <div id="loading" role="status" aria-live="polite"><span>LOADING</span></div>
  <section id="opening" class="gate-pending" aria-label="選擇季節" aria-hidden="true" inert>
   <button class="season summer" data-season="summer" aria-label="SUMMER"><img class="poster" src="./首頁影片/summer-poster.jpg" alt=""><video autoplay muted loop playsinline preload="auto" poster="./首頁影片/summer-poster.jpg" aria-hidden="true" src="./首頁影片/summer-web.mp4"></video><span class="season-title">SUMMER</span></button>
   <button class="season winter" data-season="winter" aria-label="WINTER"><img class="poster" src="./首頁影片/winter-poster.jpg" alt=""><video autoplay muted loop playsinline preload="auto" poster="./首頁影片/winter-poster.jpg" aria-hidden="true" src="./首頁影片/winter-web.mp4"></video><span class="season-title">WINTER</span></button>
  </section>
  <section id="shop" hidden aria-label="季節商品瀏覽">
   <header class="phone-nav"><button data-back aria-label="返回季節首頁">↖ BACK</button><button data-overview id="season-name">SUMMER</button><button data-bag>BAG <span class="bag-count">(0)</span></button></header>
   <div id="product" tabindex="-1"></div>
  </section>
  <dialog id="modal" aria-labelledby="modal-title"><form method="dialog" class="close-form"><button class="close" aria-label="關閉">×</button></form><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
 </div></div>
</main>
<noscript><style>#loading{display:none}#opening{visibility:visible;opacity:1}</style><p class="noscript">請啟用 JavaScript 以瀏覽商品。</p></noscript>
<script src="catalog.js"></script><script src="app.js"></script>
</body></html>
